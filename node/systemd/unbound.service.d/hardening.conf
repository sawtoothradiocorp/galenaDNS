# galena-dns hardening for unbound.
[Service]
# Roughly 895,000 RPZ entries live in this process. A cap means a runaway zone
# restarts unbound instead of letting the OOM killer choose a victim — which on
# a 4 GB node is as likely to be dnsdist or sshd as unbound itself.
MemoryMax=${GALENA_UNBOUND_MEMORY_MAX}
MemoryAccounting=yes

Restart=on-failure
RestartSec=2s

# Loading ~895,000 RPZ entries at startup is not instant; do not let systemd
# declare failure while it is legitimately working.
TimeoutStartSec=5min
