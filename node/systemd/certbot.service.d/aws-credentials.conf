# galena-dns — AWS credentials for ACME DNS-01 renewal via Route 53.
#
# This drop-in is load-bearing. The certbot-dns-route53 plugin takes credentials
# from the environment or a file, and has no --credentials flag of its own. The
# initial issuance in bootstrap.sh exports these, but RENEWAL runs from Debian's
# certbot.timer with a clean environment — so without this file renewal fails
# roughly 60 days later, quietly, and the resolver starts serving an expired
# certificate.
#
# Both variables point at the same file on purpose: the plugin's own docs name
# AWS_CONFIG_FILE while boto3's documented variable for credentials is
# AWS_SHARED_CREDENTIALS_FILE. A [default] section is valid for either.
[Service]
Environment=AWS_SHARED_CREDENTIALS_FILE=/etc/letsencrypt/aws.credentials
Environment=AWS_CONFIG_FILE=/etc/letsencrypt/aws.credentials
Environment=AWS_DEFAULT_REGION=us-east-1
