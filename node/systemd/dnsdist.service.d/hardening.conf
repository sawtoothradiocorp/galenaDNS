# galena-dns hardening for dnsdist.
[Service]
# Binding 443 and 853 as an unprivileged user needs exactly this and nothing more.
AmbientCapabilities=CAP_NET_BIND_SERVICE
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
NoNewPrivileges=yes

# `full` rather than `strict`: strict would also make /etc and /var read-only,
# and the certificate reload path writes nothing but does need them mounted
# normally. This keeps /usr and /boot read-only, which is where it matters.
ProtectSystem=full
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK

# NOT set: MemoryDenyWriteExecute. dnsdist's configuration is LuaJIT, which
# JIT-compiles and therefore needs writable-executable pages. Setting it here
# would make dnsdist fail to start with an error that points nowhere useful.

Restart=on-failure
RestartSec=2s
