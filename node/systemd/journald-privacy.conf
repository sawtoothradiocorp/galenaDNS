# galena-dns — logs live in RAM and are lost on reboot. That is the point.
#
# Tradeoff, stated plainly: if dnsdist or unbound crash-loops across a reboot,
# there is no forensic trail. Privacy costs you that. Use `journalctl -f` while
# reproducing a problem instead.
[Journal]
Storage=volatile
RuntimeMaxUse=${GALENA_JOURNAL_RUNTIME_MAX_USE}
RuntimeMaxFileSize=4M
RuntimeMaxFiles=4
ForwardToSyslog=no
ForwardToWall=no
ForwardToKMsg=no
Seal=no
Audit=no
# Drop informational chatter so the small RAM budget holds real problems.
MaxLevelStore=warning
